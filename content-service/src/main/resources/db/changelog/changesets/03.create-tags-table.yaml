databaseChangeLog:
  - changeSet:
      id: 03.create-tags-table.yaml
      author: maxim
      changes:

        - createTable:
            tableName: tags
            ifNotExists: true
            remarks: "Таблица тегов"
            columns:

              - column:
                  name: id
                  type: uuid
                  remarks: "ID тега"
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: varchar
                  remarks: "Название тега"
                  constraints:
                    nullable: false

        - createIndex:
            tableName: tags
            indexName: idx_tags_name
            columns:
              - column:
                  name: name