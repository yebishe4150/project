databaseChangeLog:
  - changeSet:
      id: 01-create-user-credentials
      author: maxim

      changes:
        - createTable:
            tableName: user_credentials
            remarks: "Таблица учетных данных пользователей"
            columns:
              - column:
                  name: user_id
                  type: uuid
                  remarks: "Идентификатор пользователя"
                  constraints:
                    primaryKey: true

              - column:
                  name: login_name
                  type: varchar
                  remarks: "Логин пользователя"
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: varchar
                  remarks: "Хэш пароля"
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: varchar
                  constraints:
                    nullable: false

              - column:
                  name: create_time
                  type: timestamp
                  defaultValue: now()
                  remarks: "Время создания записи"

              - column:
                  name: update_time
                  type: timestamp
                  defaultValue: now()
                  remarks: "Время обновления записи"