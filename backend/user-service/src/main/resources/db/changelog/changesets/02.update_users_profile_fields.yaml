databaseChangeLog:
  - changeSet:
      id: 02.update_users_profile_fields.yaml
      author: maxim
      changes:
        - renameColumn:
            tableName: users
            oldColumnName: name
            newColumnName: first_name
            columnDataType: varchar
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: second_name
                  type: varchar
              - column:
                  name: nickname
                  type: varchar
              - column:
                  name: email
                  type: varchar
              - column:
                  name: phone_number
                  type: varchar
        - addUniqueConstraint:
            tableName: users
            columnNames: nickname
            constraintName: uk_users_nickname
