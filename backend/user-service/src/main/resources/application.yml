server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/user_db}
    username: ${USER_DB_USERNAME:user}
    password: ${USER_DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

security:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:super-secret}
  jwt:
    secret: ${JWT_SECRET:super-secret-key-super-secret-key-super-secret-key-123}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  me:
    limit: ${RATE_LIMIT_ME_LIMIT:120}
    window-seconds: ${RATE_LIMIT_ME_WINDOW_SECONDS:60}
  update-me:
    limit: ${RATE_LIMIT_UPDATE_ME_LIMIT:10}
    window-seconds: ${RATE_LIMIT_UPDATE_ME_WINDOW_SECONDS:60}
  internal-create:
    limit: ${RATE_LIMIT_INTERNAL_CREATE_LIMIT:30}
    window-seconds: ${RATE_LIMIT_INTERNAL_CREATE_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
