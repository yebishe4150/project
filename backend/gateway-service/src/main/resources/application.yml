server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:

          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v*/auth/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v*/users/**
              filters:
                - StripPrefix=1

            - id: content-service
              uri: ${CONTENT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v*/content/**
              filters:
                - StripPrefix=1

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                # Intentional for local-only development.
                # Browser requests go to Vite on the same origin, and Vite proxies /api to this gateway,
                # so gateway CORS is not part of the normal frontend flow.
                # Revisit only if the browser starts calling the gateway directly from another origin.
                allowedOriginPatterns:
                  - "*"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

security:
  jwt:
    secret: ${JWT_SECRET:super-secret-key-super-secret-key-super-secret-key-123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
