spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  cloud:
    openfeign:
      client:
        config:
          user-service:
            connectTimeout: 75
            readTimeout: 75

logging:
  level:
    root: WARN
    project.content_service: INFO
    org.springframework.security: WARN
    org.springframework.test: WARN
    org.springframework.web: WARN
    liquibase: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    com.zaxxer.hikari: WARN
    org.springdoc: WARN

s3:
  endpoint: http://localhost:9000
  external-endpoint: http://cdn.local:9000
  access-key: admin
  secret-key: password123
  bucket: images
  region: us-east-1

security:
  internal:
    token: super-secret
  jwt:
    secret: super-secret-key-super-secret-key-super-secret-key

services:
  user:
    url: http://localhost:${wiremock.server.port}

rate-limit:
  enabled: false
