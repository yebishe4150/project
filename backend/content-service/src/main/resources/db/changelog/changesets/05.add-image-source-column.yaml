databaseChangeLog:
  - changeSet:
      id: 05.add-image-source-column.yaml
      author: maxim
      changes:
        - addColumn:
            tableName: images
            columns:
              - column:
                  name: source
                  type: varchar
                  remarks: "Источник изображения: upload или ai generation"

        - update:
            tableName: images
            columns:
              - column:
                  name: source
