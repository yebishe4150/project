databaseChangeLog:
  - changeSet:
      id: 04.create-image-tags-table.yaml
      author: maxim
      changes:

        - createTable:
            tableName: image_tags
            ifNotExists: true
            remarks: "Связь изображений и тегов (ManyToMany)"
            columns:

              - column:
                  name: image_id
                  type: uuid
                  constraints:
                    nullable: false

              - column:
                  name: tag_id
                  type: uuid
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: image_tags
            columnNames: image_id, tag_id
            constraintName: pk_image_tags

        - addForeignKeyConstraint:
            baseTableName: image_tags
            baseColumnNames: image_id
            referencedTableName: images
            referencedColumnNames: id
            constraintName: fk_image_tags_image
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: image_tags
            baseColumnNames: tag_id
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_image_tags_tag
            onDelete: CASCADE

        - createIndex:
            tableName: image_tags
            indexName: idx_image_tags_image_id
            columns:
              - column:
                  name: image_id

        - createIndex:
            tableName: image_tags
            indexName: idx_image_tags_tag_id
            columns:
              - column:
                  name: tag_id