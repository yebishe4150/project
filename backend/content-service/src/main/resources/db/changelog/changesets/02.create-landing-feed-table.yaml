databaseChangeLog:
  - changeSet:
      id: 02.create-landing-feed-table.yaml
      author: maxim
      changes:

        - createTable:
            tableName: landing_feed
            ifNotExists: true
            remarks: "Пул изображений для лендинга"
            columns:

              - column:
                  name: id
                  type: uuid
                  remarks: "ID записи"
                  constraints:
                    primaryKey: true

              - column:
                  name: image_id
                  type: uuid
                  remarks: "Ссылка на изображение"
                  constraints:
                    nullable: false

              - column:
                  name: create_time
                  type: timestamp
                  defaultValue: now()
                  remarks: "Время создания записи"

              - column:
                  name: update_time
                  type: timestamp
                  defaultValue: now()
                  remarks: "Время обновления записи"

        - addForeignKeyConstraint:
            baseTableName: landing_feed
            baseColumnNames: image_id
            referencedTableName: images
            referencedColumnNames: id
            constraintName: fk_landing_feed_image
            onDelete: CASCADE

        - createIndex:
            tableName: landing_feed
            indexName: idx_landing_feed_image_id
            columns:
              - column:
                  name: image_id