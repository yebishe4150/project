server:
  port: 8083

spring:
  application:
    name: content-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/content_db}
    username: ${CONTENT_DB_USERNAME:user}
    password: ${CONTENT_DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

s3:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  external-endpoint: ${S3_EXTERNAL_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:admin}
  secret-key: ${S3_SECRET_KEY:password123}
  bucket: ${S3_BUCKET:images}
  region: ${S3_REGION:us-east-1}

security:
  jwt:
    secret: ${JWT_SECRET:super-secret-key-super-secret-key-super-secret-key-123}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  upload:
    limit: ${RATE_LIMIT_UPLOAD_LIMIT:20}
    window-seconds: ${RATE_LIMIT_UPLOAD_WINDOW_SECONDS:60}
  image-generation:
    limit: ${RATE_LIMIT_IMAGE_GENERATION_LIMIT:5}
    window-seconds: ${RATE_LIMIT_IMAGE_GENERATION_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
