server:
  port: 8083

spring:
  application:
    name: content-service

  datasource:
    url: jdbc:postgresql://localhost:5434/content_db
    username: ${CONTENT_DB_USERNAME:user}
    password: ${CONTENT_DB_PASSWORD:password}

  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

s3:
  endpoint: http://localhost:9000
  external-endpoint: http://192.168.0.157:9000
  access-key: ${S3_ACCESS_KEY:admin}
  secret-key: ${S3_SECRET_KEY:password123}
  bucket: images
  region: us-east-1

security:
  jwt:
    secret: ${JWT_SECRET:super-secret-key-super-secret-key-super-secret-key-123}
